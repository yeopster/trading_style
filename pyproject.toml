[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauquant"
version = "0.1.0"
description = "AI-assisted quant research lab for an XAUUSD BBMA strategy (meta-labeling first)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2", "httpx>=0.27"]
tracking = ["mlflow>=2.12"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["xauquant*", "quant_research_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
